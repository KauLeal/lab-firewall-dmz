LAB_DESCRIPTION="Firewall + DMZ: Seguranca de Perimetro e Defense in Depth"
LAB_VERSION="1.0"
LAB_AUTHOR="Grupo - Seguranca de Redes"
LAB_EMAIL="engenharia@inovaxio.com.br"
LAB_WEB="https://www.kathara.org/"

# ---------------------------------------------------------------------------
# Dominios de colisao (redes):
#   inet -> "Internet"  203.0.113.0/24   (internet <-> r0)
#   wan  -> Link WAN    198.51.100.0/30  (r0 <-> fw)
#   lan  -> LAN         10.0.1.0/24      (fw <-> pc1, pc2)
#   dmz  -> DMZ         10.0.2.0/24      (fw <-> web, dns)
#   mgmt -> Gerencia    10.0.3.0/24      (fw <-> adm)   [opcional]
# ---------------------------------------------------------------------------

# --- "Internet" (nuvem da figura): host/servidor externo ---------------------
internet[0]="inet"
internet[image]="kathara/base"
internet[bridged]=false

# --- r0: roteador de borda + NAT --------------------------------------------
r0[0]="inet"
r0[1]="wan"
r0[image]="kathara/base"
r0[sysctl]="net.ipv4.ip_forward=1"

# --- fw: firewall / middlebox ------------------------------------------------
fw[0]="wan"
fw[1]="lan"
fw[2]="dmz"
fw[3]="mgmt"
fw[image]="kathara/base"
fw[sysctl]="net.ipv4.ip_forward=1"

# --- Estacoes da LAN ---------------------------------------------------------
# MAC fixo em pc2 para o experimento de camada 2 (tambem reforcado no .startup)
pc1[0]="lan/00:00:00:00:01:10"
pc1[image]="kathara/base"

pc2[0]="lan/00:00:00:00:01:11"
pc2[image]="kathara/base"

# --- Servidores da DMZ -------------------------------------------------------
web[0]="dmz"
web[image]="kathara/base"

dns[0]="dmz"
dns[image]="kathara/base"

# --- Rede de gerenciamento (opcional) ---------------------------------------
adm[0]="mgmt"
adm[image]="kathara/base"
