# Sites externos do laboratorio, separados por endereco IP.
ServerName internet.lab

# --- Site externo PERMITIDO -------------------------------------------------
<VirtualHost 203.0.113.1:80>
    ServerName ok.ext.lab
    DocumentRoot /var/www/ok
</VirtualHost>

# --- Destino PROIBIDO pela politica da organizacao --------------------------
# Repare: o MESMO conteudo e servido em DOIS enderecos IP diferentes.
# E por isso que bloquear "o IP do site" nao bloqueia "o site".
<VirtualHost 203.0.113.66:80>
    ServerName bad.ext.lab
    DocumentRoot /var/www/bad
</VirtualHost>

<VirtualHost 203.0.113.67:80>
    ServerName bad.ext.lab
    ServerAlias cdn.ext.lab
    DocumentRoot /var/www/bad
</VirtualHost>

# --- "Peer" P2P tambem responde em HTTP (para mostrar troca de porta) -------
<VirtualHost 203.0.113.10:80>
    ServerName p2p.ext.lab
    DocumentRoot /var/www/ok
</VirtualHost>
