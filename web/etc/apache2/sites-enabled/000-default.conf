ServerName web.lab.local

<VirtualHost *:80>
    ServerName web.lab.local
    DocumentRoot /var/www/html
    # /public  -> conteudo publico
    # /admin   -> area administrativa (usada na discussao de controle em L7:
    #             um firewall L3/L4 nao consegue distinguir /public de /admin,
    #             porque ambos sao "TCP 80 para 10.0.2.10")
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName web.lab.local
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/web.crt
    SSLCertificateKeyFile /etc/ssl/private/web.key
</VirtualHost>
